name: Container validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  single-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment manifests
        env:
          HEALTHQUERY_PUBLIC_URL: https://health.example.com
          HEALTHQUERY_ALLOWED_HOSTS: health.example.com
          HEALTHQUERY_CORS_ORIGINS: https://health.example.com
          HEALTHQUERY_MCP_ALLOWED_ORIGINS: https://health.example.com
          HEALTHQUERY_MCP_ISSUER_URL: https://health.example.com/mcp
          HEALTHQUERY_MCP_RESOURCE_URL: https://health.example.com/mcp
        run: docker compose -f docker-compose.example.yml config
      - name: Build the single-container image
        run: docker build --tag healthquery:ci .
      - name: Smoke test dashboard and API
        run: |
          ci_secret_dir=$(mktemp -d)
          python3 -c 'import secrets; print(secrets.token_urlsafe(48))' >"$ci_secret_dir/ingest-token"
          python3 -c 'import secrets; print(secrets.token_urlsafe(48))' >"$ci_secret_dir/read-token"
          python3 -c 'import secrets; print(secrets.token_urlsafe(48))' >"$ci_secret_dir/session-secret"
          docker run --rm --entrypoint python healthquery:ci -c \
            'from pwdlib import PasswordHash; print(PasswordHash.recommended().hash("ci-smoke-password"))' \
            >"$ci_secret_dir/admin-password-hash"
          chmod 0444 "$ci_secret_dir"/*
          ci_read_token=$(<"$ci_secret_dir/read-token")
          trap 'docker stop healthquery-ci >/dev/null 2>&1 || true; rm -f "$ci_secret_dir"/*; rmdir "$ci_secret_dir"' EXIT
          docker run --detach --rm --name healthquery-ci --publish 8000:8000 \
            --env HEALTHQUERY_ENV=development \
            --volume "$ci_secret_dir/ingest-token:/run/secrets/ingest_token:ro" \
            --volume "$ci_secret_dir/read-token:/run/secrets/read_token:ro" \
            --volume "$ci_secret_dir/admin-password-hash:/run/secrets/admin_password_hash:ro" \
            --volume "$ci_secret_dir/session-secret:/run/secrets/session_secret:ro" \
            healthquery:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "HealthQuery"
          curl --fail --silent --header "Authorization: Bearer $ci_read_token" \
            http://127.0.0.1:8000/api/health/overview >/dev/null
